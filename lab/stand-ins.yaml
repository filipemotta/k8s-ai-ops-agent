---
# Port 443, like the APIs it stands in for (the proxy only tunnels to 443).
apiVersion: v1
kind: Service
metadata:
  name: allowed-upstream
  namespace: lab-upstream
spec:
  selector: {app: allowed-upstream}
  ports:
  - {name: https, port: 443, targetPort: http}
