# Release candidate 1.5.0: a refactor dropped PAYMENTS_URL from the manifest.
# The new pods exit at start; with maxUnavailable 0 the old pod keeps serving,
# so the Deployment does not look down. This is what the sandbox is for.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  labels: {app: checkout}
spec:
  replicas: 1
  progressDeadlineSeconds: 90
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}   # the old version keeps serving
  selector:
    matchLabels: {app: checkout}
  template:
    metadata:
      labels:
        app: checkout
        app.kubernetes.io/version: "1.5.0"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: checkout
        image: python:3.13-alpine@sha256:9ef1a599f863231c3d91e941389bfdc4a2d6070557243d54df1a4e57015b960e
        command: ["python3", "-u", "/app/app.py"]
        env:
        - {name: VERSION, value: "1.5.0"}
        ports:
        - {name: http, containerPort: 8080}
        readinessProbe:
          httpGet: {path: /, port: http}
          periodSeconds: 3
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: ["ALL"]}
        resources:
          requests: {cpu: 5m, memory: 24Mi}
          limits: {memory: 48Mi}
        volumeMounts:
        - {name: app, mountPath: /app}
      volumes:
      - name: app
        configMap: {name: checkout-app}
