# Adversarial probe: a pod in the agent's namespace that passes Pod Security
# "restricted" but does not ask for gVisor. require-gvisor must refuse it.
apiVersion: v1
kind: Pod
metadata:
  name: probe-runc
  namespace: holmes
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile: {type: RuntimeDefault}
  containers:
  - name: probe
    image: python:3.13-alpine@sha256:9ef1a599f863231c3d91e941389bfdc4a2d6070557243d54df1a4e57015b960e
    command: ["sleep", "3600"]
    securityContext:
      allowPrivilegeEscalation: false
      capabilities: {drop: ["ALL"]}
