# Adversarial probe: a pod in the agent's namespace that asks for gVisor but
# runs as root with the default capabilities. Pod Security "restricted" must
# refuse it.
apiVersion: v1
kind: Pod
metadata:
  name: probe-root
  namespace: holmes
spec:
  runtimeClassName: gvisor
  containers:
  - name: probe
    image: python:3.13-alpine@sha256:9ef1a599f863231c3d91e941389bfdc4a2d6070557243d54df1a4e57015b960e
    command: ["sleep", "3600"]
