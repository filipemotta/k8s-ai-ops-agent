# The post-renderer adds runtimeClassName: gvisor to the agent's Deployments.
# This policy makes it a rule instead of a habit: in any namespace labelled
# agents.example.com/sandboxed=true, a Pod or Deployment without
# runtimeClassName gvisor is refused at admission. A "helm upgrade" someone
# runs without the post-renderer fails loudly instead of quietly moving the
# agent back onto the node's kernel.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: require-gvisor
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["pods"]
    - apiGroups: ["apps"]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["deployments"]
  variables:
  - name: podSpec
    expression: "object.kind == 'Pod' ? object.spec : object.spec.template.spec"
  validations:
  - expression: "has(variables.podSpec.runtimeClassName) && variables.podSpec.runtimeClassName == 'gvisor'"
    message: "agent workloads must run with runtimeClassName: gvisor (namespace is labelled agents.example.com/sandboxed=true)"
    reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: require-gvisor
spec:
  policyName: require-gvisor
  validationActions: ["Deny"]
  matchResources:
    namespaceSelector:
      matchLabels:
        agents.example.com/sandboxed: "true"
