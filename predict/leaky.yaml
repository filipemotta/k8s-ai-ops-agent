# A workload that is healthy now and will not be in a few minutes: it holds on
# to 2 MiB more every 5 seconds (24 MiB a minute) against a 192 MiB limit, so
# the kernel OOM-kills it about seven minutes after it starts. Until then it is
# Running, Ready and has no restarts: nothing a status check would flag.
apiVersion: v1
kind: ConfigMap
metadata:
  name: leaky
  namespace: shop
data:
  app.py: |
    import threading, time
    from http.server import BaseHTTPRequestHandler, HTTPServer

    class Health(BaseHTTPRequestHandler):
        def do_GET(self):
            self.send_response(200)
            self.end_headers()
            self.wfile.write(b"ok")
        def log_message(self, *args):
            pass

    threading.Thread(target=HTTPServer(("0.0.0.0", 8080), Health).serve_forever, daemon=True).start()
    held = []
    while True:
        held.append(b"\x01" * (2 * 1024 * 1024))  # written, so it is resident
        print(f"holding {len(held) * 2} MiB", flush=True)
        time.sleep(5)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: leaky
  namespace: shop
spec:
  replicas: 1
  selector:
    matchLabels: {app: leaky}
  template:
    metadata:
      labels: {app: leaky}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: leaky
        image: python:3.13-alpine@sha256:9ef1a599f863231c3d91e941389bfdc4a2d6070557243d54df1a4e57015b960e
        command: ["python3", "-u", "/app/app.py"]
        ports:
        - {name: http, containerPort: 8080}
        readinessProbe:
          httpGet: {path: /, port: http}
          periodSeconds: 5
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: ["ALL"]}
        resources:
          requests: {cpu: 10m, memory: 192Mi}
          limits: {memory: 192Mi}
        volumeMounts:
        - {name: app, mountPath: /app}
      volumes:
      - name: app
        configMap: {name: leaky}
