# Pods that set runtimeClassName: gvisor run under runsc: the agent talks to
# gVisor's user-space kernel (the Sentry), not to the node's Linux kernel.
# The handler name must match the containerd runtime registered on the node
# (kind/cluster.yaml).
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: gvisor
handler: runsc
