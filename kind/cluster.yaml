# kind cluster for the lab: a single node, to fit a laptop next to Prometheus,
# the agent and the workloads it watches.
#
# - kindnet, kind's default CNI, enforces standard NetworkPolicy since kind
#   v0.24 (sigs.k8s.io/kube-network-policies): the agent's egress allow-list
#   in observe/networkpolicy.yaml needs nothing else.
# - Node image v1.37.0 pinned by digest: the default image of kind v0.33.0
#   (release notes).
# - containerdConfigPatches registers the gVisor runtime handler "runsc" in
#   containerd (config version 2, the format of this node image). The runsc
#   binaries are copied into the node by scripts/00-cluster.sh; containerd
#   only looks for the shim when a pod asks for that handler.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: aiops
containerdConfigPatches:
- |-
  [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.runsc]
    runtime_type = "io.containerd.runsc.v1"
  [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.runsc.options]
    TypeUrl = "io.containerd.runsc.v1.options"
    ConfigPath = "/etc/containerd/runsc.toml"
nodes:
- role: control-plane
  image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
